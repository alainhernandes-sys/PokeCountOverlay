name: Build PokéCount Overlay APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip
        run: |
          unzip -o PokeCount-Stealth-Android-v3.zip
          cp -rf PokeCount*/* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeCount-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
